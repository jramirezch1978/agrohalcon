# Infraestructura: PostgreSQL 17 (se levanta una sola vez con: deploy.bat stack)
name: allpashift-stack

services:
  postgres:
    image: postgres:17-alpine
    container_name: allpashift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Lima
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - allpashift_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

volumes:
  pgdata:

networks:
  allpashift_net:
    external: true
    name: allpashift_net