# Aplicacion AllpaShift (deploy.bat backend | frontend | all | <servicio>)
name: allpashift

services:
  api-gateway:
    image: ${IMAGE_REGISTRY:-allpashift}/api-gateway:${IMAGE_TAG:-latest}
    container_name: allpashift-api-gateway
    restart: unless-stopped
    environment:
      AGRO_SERVICE_URL: http://agro-service:8081
      CLIMATE_SERVICE_URL: http://climate-service:8000
    depends_on:
      - agro-service
      - climate-service
    networks: [allpashift_net]

  agro-service:
    image: ${IMAGE_REGISTRY:-allpashift}/agro-service:${IMAGE_TAG:-latest}
    container_name: allpashift-agro-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://allpashift-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CLIMATE_SERVICE_URL: http://climate-service:8000
      # Servicio de cálculos (Sheila): indicadores, campaña, rotaciones, mapa y validación 2017
      CALCULOS_URL: http://calculos:8001
      # Asistente con Groq: la clave SOLO en el .env del servidor (sin clave → modo respaldo)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      TZ: America/Lima
    depends_on:
      - calculos
    networks: [allpashift_net]

  calculos:
    image: ${IMAGE_REGISTRY:-allpashift}/calculos:${IMAGE_TAG:-latest}
    container_name: allpashift-calculos
    restart: unless-stopped
    environment:
      TZ: America/Lima
      WEB_CONCURRENCY: ${CALCULOS_WORKERS:-4}
    volumes:
      - calculos_cache:/var/cache/allpashift   # la caché sobrevive a cada despliegue
    networks: [allpashift_net]

  climate-service:
    image: ${IMAGE_REGISTRY:-allpashift}/climate-service:${IMAGE_TAG:-latest}
    container_name: allpashift-climate-service
    restart: unless-stopped
    environment:
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      TZ: America/Lima
    networks: [allpashift_net]

  frontend:
    image: ${IMAGE_REGISTRY:-allpashift}/frontend:${IMAGE_TAG:-latest}
    container_name: allpashift-frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      SSL_CERT_CN: allpashift.crisaor.org
    volumes:
      # Certificado de Let's Encrypt (lo copia el hook de certbot; ver HTTPS_CLOUDFLARE.md)
      - ${CERTS_DIR:-/opt/allpashift/certs/frontend}:/etc/nginx/certs
    depends_on:
      - api-gateway
    networks: [allpashift_net]

volumes:
  calculos_cache:

networks:
  allpashift_net:
    external: true
    name: allpashift_net