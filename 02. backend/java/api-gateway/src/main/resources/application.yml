server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                # Solo la app: en el servidor la web llega por nginx (mismo origen, sin CORS); estos son la app
                # móvil (Capacitor) y el desarrollo local. Otros orígenes: CORS_ORIGINS=a,b,c
                allowed-origins: ${CORS_ORIGINS:https://localhost,http://localhost,capacitor://localhost,http://localhost:5173}
                # Desarrollo desde el celular en la red local (Vite en la IP de la PC)
                allowed-origin-patterns: "http://192.168.*:5173,http://10.*:5173"
                allowed-methods: "*"
                allowed-headers: "*"
          routes:
            # API de la app (frontend en modo "java"): agro-service atiende /api/recomendacion, /api/mapa, /api/validacion...
            - id: allpashift-api
              uri: ${AGRO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/recomendacion,/api/mapa,/api/validacion,/api/validacion/**,/api/cultivos,/api/asistente,/api/salud,/api/suelo
            # Java: agro-service (cultivos, rotaciones, calendario)
            - id: agro-service
              uri: ${AGRO_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/agro/**
              filters:
                - StripPrefix=2
            # Python: climate-service (indicadores con datos de NASA)
            - id: climate-service
              uri: ${CLIMATE_SERVICE_URL:http://localhost:8000}
              predicates:
                - Path=/api/climate/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway