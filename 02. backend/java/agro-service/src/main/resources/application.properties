spring.application.name=agro-service
server.port=8081
# PostgreSQL (en Docker se sobreescribe con variables SPRING_DATASOURCE_*)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/allpashift}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:allpashift}
# Sin contraseña por defecto: si falta la variable, la conexión falla (nunca una clave conocida en producción).
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
# Variables de entorno (sus valores por defecto están en el código, @Value):
#   CALCULOS_URL          servicio de cálculos en Python ('02. backend/python/calculos'), por defecto http://localhost:8001
#   GROQ_API_KEY          clave de Groq para el asistente (SOLO en variable de entorno; sin clave → modo respaldo)
#   GROQ_MODEL            por defecto openai/gpt-oss-20b (licencia Apache 2.0)
#   GROQ_TIMEOUT_SEGUNDOS por defecto 8
#   GROQ_TPM / GROQ_TPD / GROQ_RPM / GROQ_RPD  cupo propio (85-90 % del plan gratuito de Groq para gpt-oss-20b: 8 000 tokens/min,
#                         200 000 tokens/día, 30 solicitudes/min, 1 000/día, POR CLAVE). Por defecto 6800 / 180000 / 25 / 900.
#                         Al agotarse, el asistente responde en modo respaldo sin llamar a Groq.
