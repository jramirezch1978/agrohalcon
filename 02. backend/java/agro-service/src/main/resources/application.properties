spring.application.name=agro-service
server.port=8081
# PostgreSQL (en Docker se sobreescribe con variables SPRING_DATASOURCE_*)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/allpashift}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:allpashift}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:allpashift}
spring.datasource.hikari.initialization-fail-timeout=-1
