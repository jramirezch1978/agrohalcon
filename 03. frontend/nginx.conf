# Límites por IP (la IP la pone nginx: el cliente no la puede falsificar).
# api: cada coordenada nueva consulta NASA POWER y SoilGrids; sin límite, un abusador agota el cupo con la NASA.
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=erddap:10m rate=1r/s;
limit_req_status 429;

# HSTS solo cuando la petición llegó por HTTPS (en HTTP el navegador lo ignora; así la IP por HTTP queda limpia)
map $scheme $hsts {
    https   "max-age=15552000";
    default "";
}

# 1) Acceso por IP (o cualquier otro nombre) en HTTP.
#    NO se redirige a HTTPS: el APK y la app iOS ya publicados llaman a http://2.29.101.199
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/app-locations.inc;
}

# 2) Dominio por HTTP -> redirige a HTTPS.
#    Requiere en Cloudflare SSL/TLS = "Full (strict)" (con "Flexible" habría un bucle de redirecciones).
server {
    listen 80;
    server_name allpashift.crisaor.org;
    return 301 https://$host$request_uri;
}

# 3) Dominio por HTTPS. Certificado en /etc/nginx/certs (Let's Encrypt; ver deploy/vps/HTTPS_CLOUDFLARE.md)
server {
    listen 443 ssl;
    http2 on;
    server_name allpashift.crisaor.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Detrás de Cloudflare la conexión llega desde sus IP: se recupera la IP real del visitante para que el
    # límite por IP de arriba cuente a cada usuario por separado (y no a todos juntos como "Cloudflare").
    include /etc/nginx/conf.d/cloudflare-realip.inc;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security $hsts always;

    include /etc/nginx/conf.d/app-locations.inc;
}
